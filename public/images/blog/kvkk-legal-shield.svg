<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  
  <defs>
    <linearGradient id="goGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7941D"/>
      <stop offset="50%" stop-color="#E91E63"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071930"/>
      <stop offset="55%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#133B6B"/>
    </linearGradient>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EBF2FA"/>
    </linearGradient>
    <linearGradient id="deviceBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7941D"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0B2545" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0B2545" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="darkGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#navyBg)"/>
  <rect width="960" height="540" fill="url(#darkGrid)"/>
  <circle cx="880" cy="70" r="210" fill="#00B4D8" fill-opacity="0.12"/>
  <circle cx="80" cy="490" r="190" fill="#F7941D" fill-opacity="0.10"/>
  <!-- Header -->
  <rect x="48" y="38" width="180" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.12"/>
  <circle cx="68" cy="54" r="5" fill="#F7941D"/>
  <text x="82" y="59" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.6">YASAL MEVZUAT & KVKK</text>
  <text x="48" y="112" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">6698 Sayılı KVKK ve BTK Uyumlu Araç Takip</text>
  <text x="48" y="142" font-family="system-ui, sans-serif" font-size="16" fill="#94A3B8">IMEI Kayıtlı Resmi Donanım, Şeffaf Aydınlatma ve Türkiye Veri Merkezleri</text>
  <rect x="48" y="160" width="96" height="4" rx="2" fill="url(#goGrad)"/>
  
      <g font-family="system-ui, sans-serif">
        <path d="M 220 205 L 330 240 L 330 340 C 330 400 220 448 220 448 C 220 448 110 400 110 340 L 110 240 Z" fill="#00B4D8" fill-opacity="0.16" stroke="url(#goGrad)" stroke-width="4"/>
        <text x="220" y="320" text-anchor="middle" font-size="34" font-weight="900" fill="#FFFFFF">KVKK</text>
        <text x="220" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#38BDF8">%100 YASAL &amp; BTK</text>

        <rect x="410" y="205" width="500" height="70" rx="16" fill="#FFFFFF" fill-opacity="0.08"/>
        <text x="440" y="236" font-size="16" font-weight="700" fill="#FFFFFF">1. BTK Onaylı &amp; IMEI Kayıtlı Cihazlar</text>
        <text x="440" y="259" font-size="13" fill="#CBD5E1">Kayıtsız &quot;böcek&quot; cihazlardan farklı olarak yasal faturalı ve 2 yıl garantili.</text>

        <rect x="410" y="292" width="500" height="70" rx="16" fill="#FFFFFF" fill-opacity="0.08"/>
        <text x="440" y="323" font-size="16" font-weight="700" fill="#FFFFFF">2. Şirket Araçlarında Aydınlatma Metni</text>
        <text x="440" y="346" font-size="13" fill="#CBD5E1">Sürücülerin bilgilendirilmesi ile KVKK ve İş Kanunu&apos;na tam uyum sağlanır.</text>

        <rect x="410" y="379" width="500" height="70" rx="16" fill="#FFFFFF" fill-opacity="0.08"/>
        <text x="440" y="410" font-size="16" font-weight="700" fill="#FFFFFF">3. 256-Bit SSL &amp; Türkiye Sunucu Barındırma</text>
        <text x="440" y="433" font-size="13" fill="#CBD5E1">Konum verileriniz yurt dışına çıkmadan güvenli TR veri merkezlerinde korunur.</text>
      </g>
    
  <!-- Footer brand -->
  <text x="912" y="512" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#94A3B8">lifegomobil.com • Akıllı GPS &amp; Filo Teknolojileri</text>
</svg>