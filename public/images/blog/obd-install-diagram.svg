<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  
  <defs>
    <linearGradient id="goGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7941D"/>
      <stop offset="50%" stop-color="#E91E63"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071930"/>
      <stop offset="55%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#133B6B"/>
    </linearGradient>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EBF2FA"/>
    </linearGradient>
    <linearGradient id="deviceBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7941D"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0B2545" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0B2545" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="darkGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#navyBg)"/>
  <rect width="960" height="540" fill="url(#darkGrid)"/>
  <circle cx="880" cy="70" r="210" fill="#00B4D8" fill-opacity="0.12"/>
  <circle cx="80" cy="490" r="190" fill="#F7941D" fill-opacity="0.10"/>
  <!-- Header -->
  <rect x="48" y="38" width="180" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.12"/>
  <circle cx="68" cy="54" r="5" fill="#F7941D"/>
  <text x="82" y="59" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.6">MONTAJ REHBERİ</text>
  <text x="48" y="112" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">Araç Takip Cihazı Nereye Takılır?</text>
  <text x="48" y="142" font-family="system-ui, sans-serif" font-size="16" fill="#94A3B8">Gizli Kablolu Montaj, Tak-Çalıştır OBD-II Portu ve Mıknatıslı Şasi Noktaları</text>
  <rect x="48" y="160" width="96" height="4" rx="2" fill="url(#goGrad)"/>
  
      <g font-family="system-ui, sans-serif">
        <!-- Stylized car top-down silhouette -->
        <rect x="120" y="215" width="440" height="215" rx="75" fill="#133B6B" stroke="#38BDF8" stroke-width="2.5"/>
        <rect x="210" y="242" width="230" height="160" rx="34" fill="#0B2545" stroke="#00B4D8" stroke-opacity="0.6"/>
        <!-- Mount Zone 1 -->
        <circle cx="245" cy="285" r="14" fill="#F7941D"/>
        <circle cx="245" cy="285" r="24" fill="none" stroke="#F7941D" stroke-width="2" stroke-dasharray="4 4"/>
        <text x="245" y="290" text-anchor="middle" font-size="12" font-weight="800" fill="#071930">1</text>
        <!-- Mount Zone 2 -->
        <circle cx="340" cy="322" r="14" fill="#00B4D8"/>
        <circle cx="340" cy="322" r="24" fill="none" stroke="#00B4D8" stroke-width="2" stroke-dasharray="4 4"/>
        <text x="340" y="327" text-anchor="middle" font-size="12" font-weight="800" fill="#071930">2</text>
        <!-- Mount Zone 3 -->
        <circle cx="485" cy="322" r="14" fill="#E91E63"/>
        <circle cx="485" cy="322" r="24" fill="none" stroke="#E91E63" stroke-width="2" stroke-dasharray="4 4"/>
        <text x="485" y="327" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">3</text>
        <!-- Legend cards -->
        <rect x="600" y="205" width="312" height="72" rx="14" fill="#FFFFFF" fill-opacity="0.08"/>
        <circle cx="628" cy="241" r="12" fill="#F7941D"/>
        <text x="628" y="246" text-anchor="middle" font-size="12" font-weight="800" fill="#071930">1</text>
        <text x="652" y="236" font-size="15" font-weight="700" fill="#FFFFFF">Direksiyon Altı OBD-II</text>
        <text x="652" y="258" font-size="12" fill="#CBD5E1">10 saniyede kablosuz tak-çalıştır</text>

        <rect x="600" y="290" width="312" height="72" rx="14" fill="#FFFFFF" fill-opacity="0.08"/>
        <circle cx="628" cy="326" r="12" fill="#00B4D8"/>
        <text x="628" y="331" text-anchor="middle" font-size="12" font-weight="800" fill="#071930">2</text>
        <text x="652" y="321" font-size="15" font-weight="700" fill="#FFFFFF">Torpido İçi Gizli Montaj</text>
        <text x="652" y="343" font-size="12" fill="#CBD5E1">Dışarıdan görünmez + motor blokaj</text>

        <rect x="600" y="375" width="312" height="72" rx="14" fill="#FFFFFF" fill-opacity="0.08"/>
        <circle cx="628" cy="411" r="12" fill="#E91E63"/>
        <text x="628" y="416" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">3</text>
        <text x="652" y="406" font-size="15" font-weight="700" fill="#FFFFFF">Bagaj / Şasi Mıknatıslı</text>
        <text x="652" y="428" font-size="12" fill="#CBD5E1">IP67 suya dayanıklı bataryalı cihaz</text>
      </g>
    
  <!-- Footer brand -->
  <text x="912" y="512" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#94A3B8">lifegomobil.com • Akıllı GPS &amp; Filo Teknolojileri</text>
</svg>