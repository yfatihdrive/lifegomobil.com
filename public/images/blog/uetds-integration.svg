<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  
  <defs>
    <linearGradient id="goGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7941D"/>
      <stop offset="50%" stop-color="#E91E63"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071930"/>
      <stop offset="55%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#133B6B"/>
    </linearGradient>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EBF2FA"/>
    </linearGradient>
    <linearGradient id="deviceBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7941D"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0B2545" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0B2545" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="darkGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#navyBg)"/>
  <rect width="960" height="540" fill="url(#darkGrid)"/>
  <circle cx="880" cy="70" r="210" fill="#00B4D8" fill-opacity="0.12"/>
  <circle cx="80" cy="490" r="190" fill="#F7941D" fill-opacity="0.10"/>
  <!-- Header -->
  <rect x="48" y="38" width="180" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.12"/>
  <circle cx="68" cy="54" r="5" fill="#F7941D"/>
  <text x="82" y="59" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.6">RESMİ ENTEGRASYON</text>
  <text x="48" y="112" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">U-ETDS Otomatik Veri Aktarım Sistemi</text>
  <text x="48" y="142" font-family="system-ui, sans-serif" font-size="16" fill="#94A3B8">Ulaştırma ve Altyapı Bakanlığı Mevzuatına %100 Uyumlu Servis & Lojistik Takibi</text>
  <rect x="48" y="160" width="96" height="4" rx="2" fill="url(#goGrad)"/>
  
      <g font-family="system-ui, sans-serif">
        <rect x="48" y="215" width="260" height="220" rx="20" fill="#FFFFFF" fill-opacity="0.08" stroke="#00B4D8"/>
        <text x="178" y="268" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">Servis / Tır Filosu</text>
        <text x="178" y="302" text-anchor="middle" font-size="13" fill="#CBD5E1">LG-800 U-ETDS Cihazı</text>
        <text x="178" y="330" text-anchor="middle" font-size="13" fill="#CBD5E1">Sefer • Plaka • Konum • Hız</text>
        <rect x="98" y="362" width="160" height="32" rx="16" fill="#00B4D8" fill-opacity="0.22"/>
        <text x="178" y="383" text-anchor="middle" font-size="12" font-weight="700" fill="#38BDF8">Anlık Telemetri</text>

        <path d="M 318 325 L 368 325" stroke="url(#goGrad)" stroke-width="5" stroke-linecap="round"/>

        <rect x="378" y="215" width="210" height="220" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#F7941D" stroke-width="2"/>
        <text x="483" y="268" text-anchor="middle" font-size="20" font-weight="800" fill="#F7941D">LifeGO API</text>
        <text x="483" y="302" text-anchor="middle" font-size="13" fill="#E2E8F0">Otomatik Doğrulama</text>
        <text x="483" y="330" text-anchor="middle" font-size="13" fill="#E2E8F0">Hata &amp; Ceza Önleme</text>
        <rect x="413" y="362" width="140" height="32" rx="16" fill="#F7941D" fill-opacity="0.24"/>
        <text x="483" y="383" text-anchor="middle" font-size="12" font-weight="700" fill="#FDBA74">7/24 Senkron</text>

        <path d="M 598 325 L 648 325" stroke="url(#goGrad)" stroke-width="5" stroke-linecap="round"/>

        <rect x="658" y="215" width="254" height="220" rx="20" fill="#FFFFFF" fill-opacity="0.08" stroke="#22C55E"/>
        <text x="785" y="268" text-anchor="middle" font-size="20" font-weight="800" fill="#4ADE80">U-ETDS Sistemi</text>
        <text x="785" y="302" text-anchor="middle" font-size="13" fill="#CBD5E1">Ulaştırma Bakanlığı</text>
        <text x="785" y="330" text-anchor="middle" font-size="13" fill="#CBD5E1">Kesintisiz Resmi Kayıt</text>
        <rect x="705" y="362" width="160" height="32" rx="16" fill="#22C55E" fill-opacity="0.22"/>
        <text x="785" y="383" text-anchor="middle" font-size="12" font-weight="700" fill="#4ADE80">%100 Mevzuat Uyumu</text>
      </g>
    
  <!-- Footer brand -->
  <text x="912" y="512" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#94A3B8">lifegomobil.com • Akıllı GPS &amp; Filo Teknolojileri</text>
</svg>