        <path d="M 476 325 L 506 325" stroke="#E91E63" stroke-width="3" stroke-dasharray="6 4"/>

        <rect x="512" y="210" width="190" height="230" rx="20" fill="#FFFFFF" fill-opacity="0.07" stroke="#E91E63" stroke-opacity="0.5"/>
