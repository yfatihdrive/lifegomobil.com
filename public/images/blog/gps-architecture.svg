  <text x="48" y="112" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">Araç Takip Sistemi Nasıl Çalışır?</text>
  <text x="48" y="142" font-family="system-ui, sans-serif" font-size="16" fill="#94A3B8">Uydu (GPS/GLONASS) → 4G LTE M2M Hat → LifeGO Bulut Sunucu → Mobil & Web Panel</text>
  <rect x="48" y="160" width="96" height="4" rx="2" fill="url(#goGrad)"/>
  
      <g font-family="system-ui, sans-serif">
